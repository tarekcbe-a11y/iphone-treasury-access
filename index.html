<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الحاسبة - عملاء البنوك المصرية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: #161b22;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #30363d;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid #d4af37;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #f0f6fc;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 2px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #d4af37;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        .error {
            color: #f85149;
            font-size: 13px;
            margin-top: 15px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- اللوجو الموجود في المستودع -->
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        
        <h2>حاسبة أذون الخزانة</h2>
        <p>الرجاء إدخال كود التفعيل المخصص للوصول إلى الحاسبة</p>
        
        <input type="password" id="passcode" placeholder="أدخل كود التفعيل">
        <button onclick="checkCode()">دخول</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        // ---------------------------------------------------------
        // يمكنك تغيير الكود السري هنا بكل سهولة بين علامتي التنصيص
        const CORRECT_CODE = "EGBANK2026";
        // ---------------------------------------------------------

        // التحقق عند فتح الصفحة إذا كان الجهاز مفعل مسبقاً
        window.onload = function() {
            if (localStorage.getItem("is_logged_in") === "true") {
                window.location.href = "calculator.html";
            }
        };

        function checkCode() {
            let enteredCode = document.getElementById("passcode").value.trim();
            let errorMsg = document.getElementById("errorMsg");

            if (enteredCode === CORRECT_CODE) {
                // حفظ التفعيل محلياً على جهاز العميل لتفتح مباشرة المرات القادمة
                localStorage.setItem("is_logged_in", "true");
                window.location.href = "calculator.html";
            } else {
                errorMsg.innerText = "كود التفعيل غير صحيح، يرجى التواصل للحصول عليه.";
            }
        }
    </script>

</body>
</html>
