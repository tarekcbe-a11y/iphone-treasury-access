<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تفعيل الحاسبة - جروب عملاء البنوك المصرية</title>
    
    <!-- إعدادات تطبيق الويب والشاشة الكاملة (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حاسبة الأذون">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        .login-card {
            background: #1e293b;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 2px solid #ffd700;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #ffd700;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }
        p {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid #ffd700;
            color: #fff;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 2px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        .error {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 15px;
            min-height: 18px;
        }
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #ffd700;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        
        <h2>حاسبة أذون الخزانة</h2>
        <p>الرجاء إدخال كود التفعيل المخصص للوصول إلى الحاسبة</p>
        
        <input type="password" id="passcode" placeholder="أدخل كود التفعيل">
        <button onclick="checkCode()">دخول</button>
        <div id="errorMsg" class="error"></div>

        <div class="footer">
            🛡️ جروب عملاء البنوك المصرية<br>Developed by Tarek Metwally
        </div>
    </div>

    <script>
        // ==========================================
        // اكتب الكود السري هنا بكل سهولة:
        const CORRECT_CODE = "EGBANK2026";
        // ==========================================

        // التحقق عند فتح الصفحة إذا كان الجهاز مفعل مسبقاً
        window.onload = function() {
            if (localStorage.getItem("is_logged_in") === "true") {
                window.location.href = "calculator.html";
            }
        };

        function checkCode() {
            let enteredCode = document.getElementById("passcode").value.trim();
            let errorMsg = document.getElementById("errorMsg");

            if (enteredCode === CORRECT_CODE) {
                // حفظ التفعيل محلياً على جهاز العميل لتفتح مباشرة المرات القادمة
                localStorage.setItem("is_logged_in", "true");
                window.location.href = "calculator.html";
            } else {
                errorMsg.innerText = "كود التفعيل غير صحيح، يرجى التواصل للحصول عليه.";
            }
        }
    </script>

</body>
</html>
