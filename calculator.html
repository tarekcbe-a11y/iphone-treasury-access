<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة أذون الخزانة - عملاء البنوك المصرية</title>
    
    <!-- كود حماية الصفحة من الدخول المباشر قبل تسجيل الدخول -->
    <script>
        if (localStorage.getItem("is_logged_in") !== "true") {
            window.location.href = "index.html";
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #161b22;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 420px;
            border: 1px solid #30363d;
            text-align: center;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
        }
        h2 {
            font-size: 18px;
            color: #f0f6fc;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #d4af37;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .results {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #30363d;
            text-align: right;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .result-item span.val {
            color: #d4af37;
            font-weight: bold;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #f85149;
            color: #f85149;
            font-size: 12px;
            padding: 6px 12px;
            margin-top: 15px;
            width: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            <h2>حاسبة أذون الخزانة</h2>
        </div>

        <div class="input-group">
            <label>القيمة الاسمية (جنيه):</label>
            <input type="number" id="faceValue" placeholder="مثال: 100000" value="100000">
        </div>

        <div class="input-group">
            <label>معدل الفائدة السنوي (%):</label>
            <input type="number" step="0.01" id="interestRate" placeholder="مثال: 25" value="25">
        </div>

        <div class="input-group">
            <label>المدة (أيام):</label>
            <select id="tenure">
                <option value="91">91 يوم</option>
                <option value="182">182 يوم</option>
                <option value="273">273 يوم</option>
                <option value="364">364 يوم</option>
            </select>
        </div>

        <button onclick="calculate()">احسب الآن</button>

        <div class="results" id="results" style="display: none;">
            <div class="result-item">
                <span>المبلغ المدفوع للشراء:</span>
                <span class="val" id="purchasePrice">0 جنيه</span>
            </div>
            <div class="result-item">
                <span>الفائدة المقدمة:</span>
                <span class="val" id="grossInterest">0 جنيه</span>
            </div>
            <div class="result-item">
                <span>الضريبة الخصم المخصومة (20%):</span>
                <span class="val" id="tax">0 جنيه</span>
            </div>
            <div class="result-item">
                <span>صافي العائد الفعلي:</span>
                <span class="val" id="netInterest">0 جنيه</span>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">تسجيل الخروج من الجهاز</button>
    </div>

    <script>
        function calculate() {
            let faceValue = parseFloat(document.getElementById('faceValue').value) || 0;
            let rate = parseFloat(document.getElementById('interestRate').value) || 0;
            let days = parseInt(document.getElementById('tenure').value) || 91;

            if (faceValue <= 0 || rate <= 0) {
                alert('يرجى إدخال قيم صحيحة');
                return;
            }

            // معادلات أذون الخزانة وفقاً للقوانين المصرية (ضريبة 20% على العائد)
            let interestFraction = (rate / 100) * (days / 365);
            let purchasePrice = faceValue / (1 + interestFraction);
            let grossInterest = faceValue - purchasePrice;
            let tax = grossInterest * 0.20;
            let netInterest = grossInterest - tax;

            document.getElementById('purchasePrice').innerText = purchasePrice.toFixed(2) + " جنيه";
            document.getElementById('grossInterest').innerText = grossInterest.toFixed(2) + " جنيه";
            document.getElementById('tax').innerText = tax.toFixed(2) + " جنيه";
            document.getElementById('netInterest').innerText = netInterest.toFixed(2) + " جنيه";

            document.getElementById('results').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem("is_logged_in");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
